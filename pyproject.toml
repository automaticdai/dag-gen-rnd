[project]
name = "dag-gen-rnd"
version = "0.1.0"
description = "Randomised multi-DAG task generator for scheduling and allocation research"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy==2.1",
    "networkx>=2.4",
    "matplotlib>=3.1.3",
    "pygraphviz>=1.5",
    "tqdm>=4.45.0",
    "PyQt5>=5.12",
    "drs>=2.0",
    "zipp==3.19.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
